<svg class="dgm" width="100%" viewBox="0 0 680 672" role="img" xmlns="http://www.w3.org/2000/svg">
<title>End-to-end estimation pipeline and adaptive loop</title>
<desc>Parameter bounds feed Block 1, which trains neural value and policy networks. A weight snapshot feeds Block 2, which refines the solution on a grid, simulates a firm panel, and measures 11 moments, appending each parameter and its moments to a dataset. Block 3 trains surrogate networks on the dataset and fits parameters with a Levenberg-Marquardt optimizer. The adaptive controller shrinks the parameter bounds and loops back to the start.</desc>
<style>
.dgm text{font-family:'Anthropic Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.dgm .th{font-size:14px;font-weight:500}
.dgm .ts{font-size:12px;font-weight:400}
.dgm .ft{fill:#E1F5EE;stroke:#0F6E56}
.dgm .fp{fill:#EEEDFE;stroke:#534AB7}
.dgm .fg{fill:#F1EFE8;stroke:#5F5E5A}
.dgm .tt{fill:#085041}.dgm .st2{fill:#0F6E56}
.dgm .tp{fill:#3C3489}.dgm .sp{fill:#534AB7}
.dgm .tg{fill:#2C2C2A}.dgm .sg{fill:#5F5E5A}
.dgm .lg{fill:#5F5E5A}
.dgm .cont{fill:none;stroke:#0F6E56;stroke-dasharray:5 4}
@media (prefers-color-scheme:dark){
.dgm .ft{fill:#085041;stroke:#5DCAA5}
.dgm .fp{fill:#3C3489;stroke:#AFA9EC}
.dgm .fg{fill:#444441;stroke:#B4B2A9}
.dgm .tt{fill:#9FE1CB}.dgm .st2{fill:#5DCAA5}
.dgm .tp{fill:#CECBF6}.dgm .sp{fill:#AFA9EC}
.dgm .tg{fill:#D3D1C7}.dgm .sg{fill:#B4B2A9}
.dgm .lg{fill:#B4B2A9}
.dgm .cont{stroke:#5DCAA5}
}
</style>
<defs><marker id="pipe-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<path d="M490 568 L625 568 L625 66 L492 66" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<text class="ts lg" x="500" y="556" text-anchor="start">narrower bounds</text>

<rect class="fp" x="190" y="40" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th tp" x="340" y="60" text-anchor="middle" dominant-baseline="central">Parameter bounds</text>
<text class="ts sp" x="340" y="78" text-anchor="middle" dominant-baseline="central">current search region</text>

<line x1="340" y1="92" x2="340" y2="126" stroke="#888780" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<text class="ts lg" x="348" y="110" text-anchor="start">sample β + states</text>

<rect class="ft" x="190" y="128" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th tt" x="340" y="148" text-anchor="middle" dominant-baseline="central">Block 1: train networks</text>
<text class="ts st2" x="340" y="166" text-anchor="middle" dominant-baseline="central">neural value + policy nets</text>

<line x1="340" y1="180" x2="340" y2="214" stroke="#888780" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<text class="ts lg" x="348" y="198" text-anchor="start">weight snapshot</text>

<rect class="cont" x="80" y="216" width="520" height="114" rx="12"/>
<text class="th tt" x="340" y="232" text-anchor="middle" dominant-baseline="central">Block 2: networks → moments</text>
<text class="ts st2" x="340" y="248" text-anchor="middle" dominant-baseline="central">repeat for each parameter draw</text>

<rect class="ft" x="100" y="264" width="150" height="48" rx="8" stroke-width="0.5"/>
<text class="th tt" x="175" y="282" text-anchor="middle" dominant-baseline="central">Refine on a grid</text>
<text class="ts st2" x="175" y="298" text-anchor="middle" dominant-baseline="central">value iteration</text>
<line x1="250" y1="288" x2="263" y2="288" stroke="#888780" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<rect class="ft" x="265" y="264" width="150" height="48" rx="8" stroke-width="0.5"/>
<text class="th tt" x="340" y="282" text-anchor="middle" dominant-baseline="central">Simulate firms</text>
<text class="ts st2" x="340" y="298" text-anchor="middle" dominant-baseline="central">5,000 firm panel</text>
<line x1="415" y1="288" x2="428" y2="288" stroke="#888780" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<rect class="ft" x="430" y="264" width="150" height="48" rx="8" stroke-width="0.5"/>
<text class="th tt" x="505" y="282" text-anchor="middle" dominant-baseline="central">Measure moments</text>
<text class="ts st2" x="505" y="298" text-anchor="middle" dominant-baseline="central">11 target stats</text>

<line x1="340" y1="330" x2="340" y2="364" stroke="#888780" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<text class="ts lg" x="348" y="348" text-anchor="start">append (β, moments)</text>

<rect class="fg" x="190" y="366" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th tg" x="340" y="386" text-anchor="middle" dominant-baseline="central">Dataset</text>
<text class="ts sg" x="340" y="404" text-anchor="middle" dominant-baseline="central">parameters → moments</text>

<line x1="340" y1="418" x2="340" y2="452" stroke="#888780" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<text class="ts lg" x="348" y="436" text-anchor="start">train on the dataset</text>

<rect class="ft" x="190" y="454" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th tt" x="340" y="474" text-anchor="middle" dominant-baseline="central">Block 3: fit parameters</text>
<text class="ts st2" x="340" y="492" text-anchor="middle" dominant-baseline="central">surrogates + LM optimizer</text>

<line x1="340" y1="506" x2="340" y2="540" stroke="#888780" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
<text class="ts lg" x="348" y="524" text-anchor="start">parameter estimates</text>

<rect class="fp" x="190" y="542" width="300" height="52" rx="8" stroke-width="0.5"/>
<text class="th tp" x="340" y="562" text-anchor="middle" dominant-baseline="central">Adaptive controller</text>
<text class="ts sp" x="340" y="580" text-anchor="middle" dominant-baseline="central">shrink bounds after warm-up</text>

<rect class="ft" x="40" y="620" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts lg" x="62" y="627" text-anchor="start" dominant-baseline="central">Computation stages (blocks 1 to 3)</text>
<rect class="fp" x="40" y="640" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts lg" x="62" y="647" text-anchor="start" dominant-baseline="central">Adaptive loop (bounds and controller)</text>
<rect class="fg" x="392" y="640" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts lg" x="414" y="647" text-anchor="start" dominant-baseline="central">Data store</text>
</svg>
