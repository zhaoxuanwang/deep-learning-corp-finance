<svg class="dgm" width="100%" viewBox="0 0 680 352" role="img" xmlns="http://www.w3.org/2000/svg">
<title>FiLM data flow in one value or policy network</title>
<desc>The 3 state variables enter a trunk of three hidden layers. The 8 parameters feed three small generator networks, one per trunk layer, each producing a 128-wide scale and shift that modulate its layer. The last trunk layer feeds a linear output producing one scalar.</desc>
<style>
.dgm text{font-family:'Anthropic Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.dgm .th{font-size:14px;font-weight:500}
.dgm .ts{font-size:12px;font-weight:400}
.dgm .fp{fill:#EEEDFE;stroke:#534AB7}
.dgm .ft{fill:#E1F5EE;stroke:#0F6E56}
.dgm .tp{fill:#3C3489}.dgm .sp{fill:#534AB7}
.dgm .tt{fill:#085041}.dgm .st2{fill:#0F6E56}
.dgm .lg{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.dgm .fp{fill:#3C3489;stroke:#AFA9EC}
.dgm .ft{fill:#085041;stroke:#5DCAA5}
.dgm .tp{fill:#CECBF6}.dgm .sp{fill:#AFA9EC}
.dgm .tt{fill:#9FE1CB}.dgm .st2{fill:#5DCAA5}
.dgm .lg{fill:#B4B2A9}
}
</style>
<defs><marker id="filmarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M92 80 L92 58 L458 58" fill="none" stroke="#7F77DD" stroke-width="1.5"/>
<line x1="214" y1="58" x2="214" y2="78" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#filmarrow)"/>
<line x1="336" y1="58" x2="336" y2="78" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#filmarrow)"/>
<line x1="458" y1="58" x2="458" y2="78" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#filmarrow)"/>
<rect class="fp" x="40" y="80" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tp" x="92" y="101" text-anchor="middle" dominant-baseline="central">Parameters</text>
<text class="ts sp" x="92" y="119" text-anchor="middle" dominant-baseline="central">β (8 values)</text>
<rect class="fp" x="162" y="80" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tp" x="214" y="101" text-anchor="middle" dominant-baseline="central">Generator 1</text>
<text class="ts sp" x="214" y="119" text-anchor="middle" dominant-baseline="central">β → (γ, δ)</text>
<rect class="fp" x="284" y="80" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tp" x="336" y="101" text-anchor="middle" dominant-baseline="central">Generator 2</text>
<text class="ts sp" x="336" y="119" text-anchor="middle" dominant-baseline="central">β → (γ, δ)</text>
<rect class="fp" x="406" y="80" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tp" x="458" y="101" text-anchor="middle" dominant-baseline="central">Generator 3</text>
<text class="ts sp" x="458" y="119" text-anchor="middle" dominant-baseline="central">β → (γ, δ)</text>
<line x1="214" y1="136" x2="214" y2="218" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#filmarrow)"/>
<line x1="336" y1="136" x2="336" y2="218" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#filmarrow)"/>
<line x1="458" y1="136" x2="458" y2="218" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#filmarrow)"/>
<text class="ts lg" x="222" y="178" text-anchor="start">γ, δ</text>
<text class="ts lg" x="344" y="178" text-anchor="start">γ, δ</text>
<text class="ts lg" x="466" y="178" text-anchor="start">γ, δ</text>
<rect class="ft" x="40" y="220" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tt" x="92" y="241" text-anchor="middle" dominant-baseline="central">State</text>
<text class="ts st2" x="92" y="259" text-anchor="middle" dominant-baseline="central">log z, k, b</text>
<rect class="ft" x="162" y="220" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tt" x="214" y="241" text-anchor="middle" dominant-baseline="central">Layer 1</text>
<text class="ts st2" x="214" y="259" text-anchor="middle" dominant-baseline="central">128 units</text>
<rect class="ft" x="284" y="220" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tt" x="336" y="241" text-anchor="middle" dominant-baseline="central">Layer 2</text>
<text class="ts st2" x="336" y="259" text-anchor="middle" dominant-baseline="central">128 units</text>
<rect class="ft" x="406" y="220" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tt" x="458" y="241" text-anchor="middle" dominant-baseline="central">Layer 3</text>
<text class="ts st2" x="458" y="259" text-anchor="middle" dominant-baseline="central">128 units</text>
<rect class="ft" x="528" y="220" width="104" height="56" rx="8" stroke-width="0.5"/>
<text class="th tt" x="580" y="241" text-anchor="middle" dominant-baseline="central">Output</text>
<text class="ts st2" x="580" y="259" text-anchor="middle" dominant-baseline="central">one scalar</text>
<line x1="144" y1="248" x2="160" y2="248" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#filmarrow)"/>
<line x1="266" y1="248" x2="282" y2="248" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#filmarrow)"/>
<line x1="388" y1="248" x2="404" y2="248" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#filmarrow)"/>
<line x1="510" y1="248" x2="526" y2="248" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#filmarrow)"/>
<rect class="fp" x="40" y="298" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts lg" x="62" y="305" text-anchor="start" dominant-baseline="central">Parameter pathway (each generator is a small side network)</text>
<rect class="ft" x="40" y="320" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts lg" x="62" y="327" text-anchor="start" dominant-baseline="central">State pathway (one shared trunk network)</text>
</svg>
